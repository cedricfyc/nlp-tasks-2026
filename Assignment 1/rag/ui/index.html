<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study in Germany Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <div class="app">
    <!-- History of this session (kept in the browser only; no API call) -->
    <aside class="side">
      <div class="brand">
        <div class="brand-name">Study in Germany</div>
        <div class="brand-sub">Assistant for international students</div>
      </div>
      <button id="new-chat" class="new-chat" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New chat
      </button>
      <div class="side-label">History</div>
      <div id="history" class="history"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-note">Answers only from 76 official guides, with sources</div>
        <div class="k-picker">
          <span id="k-label" class="k-label">Sources per answer</span>
          <div id="k-options" class="k-options" role="group" aria-labelledby="k-label"></div>
        </div>
      </div>

      <div id="scroll" class="scroll">
        <div id="content" class="content"></div>
      </div>

      <form id="form" class="composer">
        <div class="composer-row">
          <label for="question" class="visually-hidden">Your question</label>
          <textarea id="question" rows="1" placeholder="Ask a question…"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send question" title="Send (Enter)">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M8 5.5 29 17 8 28.5 11.5 17 8 5.5Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="ui/app.js"></script>
</body>
</html>
