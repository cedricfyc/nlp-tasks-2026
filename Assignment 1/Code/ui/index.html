<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study in Germany Assistant</title>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <main>
    <h1>Study in Germany Assistant</h1>

    </div>
  </form>

  <script src="ui/app.js"></script>
</body>
</html>
